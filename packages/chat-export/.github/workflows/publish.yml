name: Publish to npm

# Runs lint and tests on every push to main (and on pull requests), then
# publishes with npm trusted publishing when the version in package.json is
# not on the registry yet. A normal code push without a version bump skips the
# publish step cleanly. Keep this filename as `publish.yml` so the npm trusted
# publisher configuration continues to match.
#
# Before a first publish:
# 1. Make sure `repository.url` in package.json exactly matches the GitHub repo.
# 2. Publish the first version manually (`npm publish --access public`), since
#    trusted publishing cannot create a brand-new package.
# 3. On npmjs.com, configure this repository as a trusted publisher for
#    workflow filename `publish.yml`.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Trusted publishing requires `id-token: write` so GitHub Actions can mint the
# short-lived OIDC token that npm exchanges for a publish token.
# `contents: read` is the minimum needed for actions/checkout.
permissions:
  id-token: write
  contents: read

# Avoid two pushes racing to publish the same version.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@^11.5.1 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lint and tests
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Check whether the current version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pull request; checks only, will not publish."
            exit 0
          fi

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm; skipping publish."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is not on npm yet; will publish."
          fi

      - name: Publish to npm with trusted publishing
        if: steps.check.outputs.release == 'true'
        env:
          # setup-node writes a dummy NODE_AUTH_TOKEN when registry-url is set.
          # An empty value forces npm 11.5+ to use OIDC trusted publishing.
          NODE_AUTH_TOKEN: ""
        # Provenance is the default for trusted publishing from a public repo;
        # setting it explicitly surfaces attestation failures early. Checks
        # already ran above, so skip the prepublishOnly rerun.
        run: npm publish --provenance --access public --ignore-scripts
