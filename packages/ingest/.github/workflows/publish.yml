name: Publish to npm

# Run on every push. Publishing is skipped automatically if the
# version in package.json is already on the npm registry, so a normal
# code push does not fail the workflow.
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# Trusted publishing requires `id-token: write` so GitHub Actions can mint
# the short-lived OIDC token that npm exchanges for a publish token.
# `contents: read` is the minimum needed for actions/checkout.
permissions:
  id-token: write
  contents: read

# Avoid two pushes racing to publish the same version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Trusted publishing requires Node >= 22.14.0.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1. Node 22 ships with an
      # older npm, so upgrade explicitly before publishing.
      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test --if-present

      # Compare the local package.json version to whatever is currently on
      # npm. If they match there is nothing to publish, so skip cleanly.
      - name: Check whether the current version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is not on npm yet; will publish."
          fi

      # The npm CLI auto-detects the OIDC environment via id-token: write
      # and exchanges it for a short-lived publish token, so no NODE_AUTH_TOKEN
      # is needed. --provenance is set explicitly even though it is the
      # default for trusted publishing on public repos, to surface failures
      # early if attestation cannot be generated.
      - name: Publish to npm with trusted publishing
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
