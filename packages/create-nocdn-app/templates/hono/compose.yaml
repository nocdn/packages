services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: {{project-name}}:local
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: ${PORT:-{{port}}}
    ports:
      - "${PORT:-{{port}}}:${PORT:-{{port}}}"
    restart: always
