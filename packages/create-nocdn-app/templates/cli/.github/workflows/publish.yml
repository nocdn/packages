name: Publish to npm

# Before this can stage a release, publish the package once manually, then
# configure it on npmjs.com as a Trusted Publisher for this GitHub repository
# and workflow filename (`publish.yml`). Allow `npm stage publish`, and make
# sure package.json has a repository.url that exactly matches the repository.
#
# Push a tag matching the package version (for example, v1.2.3). The workflow
# submits the package for review; a maintainer must approve it with 2FA before
# it becomes available on the registry.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Avoid two tags racing to stage releases.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run checks
        run: npm run check

  publish:
    name: Stage package
    needs: check
    runs-on: ubuntu-latest
    permissions:
      # npm exchanges GitHub's OIDC token for a short-lived credential.
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Staged publishing requires Node >= 22.14.0 and npm >= 11.15.0.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm supports staged publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 15)) { console.error('::error::npm ' + process.argv[1] + ' is older than 11.15.0 and does not support staged publishing.'); process.exit(1) }" "$npm_version"

      - name: Verify tag matches package version
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $EXPECTED_TAG."
            exit 1
          fi

      - name: Verify package provenance metadata
        run: |
          node -e "const repository = require('./package.json').repository; if (!repository) { console.error('::error::Add a repository field to package.json before publishing with provenance.'); process.exit(1) }"

      # This job intentionally installs no project dependencies. The source is
      # already runnable JavaScript, and the separate check job has no access
      # to the OIDC publishing permission.
      - name: Stage package with trusted publishing
        run: npm stage publish --ignore-scripts
